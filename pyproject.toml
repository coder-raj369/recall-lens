[project]
name = "recall-lens"
version = "0.1.0"
description = "Multimodal, multi-agent assistant that verifies whether a product has been recalled."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]
# Model-based extraction and embeddings. Optional so CI and the API stay lightweight.
ml = [
    "gliner>=0.2.16",
    "protobuf>=5",  # required to load the DeBERTa tokenizer GLiNER builds on
    "sentencepiece>=0.2",
    "sentence-transformers>=3.0",
    "pillow>=11",
    "zxing-cpp>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recall_lens"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
